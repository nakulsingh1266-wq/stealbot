name: run-bot

on:
  workflow_dispatch:

  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: stealbot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Start bot
        run: npm start
